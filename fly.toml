# Fly.io config for the backend API. Deploy with:
#   fly launch --copy-config --dockerfile backend/Dockerfile
#   fly postgres create --name garden-manager-db
#   fly postgres attach garden-manager-db
#   fly secrets set JWT_SECRET=$(openssl rand -base64 48)
#   fly deploy
app = "garden-manager-api"
primary_region = "sin" # Singapore — closest region to the Philippines

[build]
  dockerfile = "backend/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  JWT_EXPIRES_IN = "7d"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
