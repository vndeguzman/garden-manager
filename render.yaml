services:
  - type: web
    name: garden-manager-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: garden-manager-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://garden-manager-web.onrender.com

  - type: web
    name: garden-manager-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: starter

databases:
  - name: garden-manager-db
    plan: starter
    databaseName: garden_manager
    user: garden
